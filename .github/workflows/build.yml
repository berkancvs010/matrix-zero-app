name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Flutter Project Structure
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org com.matrixzero --platforms android matrix_zero
          cd matrix_zero
          
          # Depodaki main.dart dosyasını oluşturulan projeye kopyala
          cp ../../lib/main.dart lib/main.dart

          # APK Derlemesini Çalıştır
          flutter build apk --release

          # APK dosyasını kök dizine taşı
          cp build/app/outputs/flutter-apk/app-release.apk ../../app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MatrixZero-APK
          path: app-release.apk
