name: Matrix Zero Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Create Android project
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi

      - name: Flutter dependencies
        run: flutter pub get

      - name: Dart analyze
        run: flutter analyze

  android:
    name: Android APK
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Create Android project
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi

      - name: Configure Android
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          text = manifest.read_text()

          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

          permissions = """\
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
          """

          if "android.permission.INTERNET" not in text:
              text = text.replace(marker, marker + "\n" + permissions, 1)

          manifest.write_text(text)

          gradle_kts = Path("android/app/build.gradle.kts")
          gradle = Path("android/app/build.gradle")

          if gradle_kts.exists():
              p = gradle_kts
          elif gradle.exists():
              p = gradle
          else:
              raise SystemExit("Android app Gradle dosyası bulunamadı.")

          text = p.read_text()

          text = text.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 23"
          )

          text = text.replace(
              "minSdk flutter.minSdkVersion",
              "minSdk 23"
          )

          p.write_text(text)
          PY

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK oluşturulamadı."
            exit 1
          fi

          echo "APK başarıyla oluşturuldu:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: matrix-zero-android-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  web:
    name: Web Chat
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build Web Chat
        run: |
          flutter build web \
            --release \
            --target lib/main_web.dart

      - name: Verify Web
        shell: bash
        run: |
          if [ ! -f "build/web/index.html" ]; then
            echo "Web build oluşturulamadı."
            exit 1
          fi

          echo "Web build başarıyla oluşturuldu."
          du -sh build/web

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: matrix-zero-web-chat
          path: build/web
          if-no-files-found: error
