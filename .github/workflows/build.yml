name: Build Matrix Zero PWA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Flutter SDK İndir ve Kur
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 _flutter
          echo "$PWD/_flutter/bin" >> $GITHUB_PATH

      - name: Flutter Sürümünü Kontrol Et
        run: flutter --version

      - name: Bağımlılıkları Al
        run: flutter pub get

      - name: Web Uygulamasını Derle
        run: flutter build web --release --no-tree-shake-icons

      - name: Çıktıyı Paketle
        uses: actions/upload-artifact@v4
        with:
          name: matrix-zero-web-pwa
          path: build/web/
          
