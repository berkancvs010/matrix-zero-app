name: Matrix Zero Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Dart analyze
        run: flutter analyze

      - name: Node server syntax
        run: node --check server/server.js

      - name: Flutter tests
        run: flutter test

  apk:
    name: Android APK
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Prepare Gradle wrapper
        run: |
          set -euo pipefail
          test -n "${FLUTTER_ROOT:-}" || { echo "FLUTTER_ROOT is not set"; exit 1; }
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
          (
            cd android
            gradle wrapper --gradle-version 9.3.1 --distribution-type all
          )
          test -x android/gradlew
          test -s android/gradle/wrapper/gradle-wrapper.jar
          grep -q 'gradle-9.3.1-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew

      - name: Prepare release signing keystore
        env:
          ZEROLOG_UPLOAD_KEYSTORE_B64: ${{ secrets.ZEROLOG_UPLOAD_KEYSTORE_B64 }}
          ZEROLOG_UPLOAD_STORE_PASSWORD: ${{ secrets.ZEROLOG_UPLOAD_STORE_PASSWORD }}
          ZEROLOG_UPLOAD_KEY_ALIAS: ${{ secrets.ZEROLOG_UPLOAD_KEY_ALIAS }}
          ZEROLOG_UPLOAD_KEY_PASSWORD: ${{ secrets.ZEROLOG_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ZEROLOG_UPLOAD_KEYSTORE_B64:-}" ] &&
             [ -n "${ZEROLOG_UPLOAD_STORE_PASSWORD:-}" ] &&
             [ -n "${ZEROLOG_UPLOAD_KEY_ALIAS:-}" ] &&
             [ -n "${ZEROLOG_UPLOAD_KEY_PASSWORD:-}" ]; then
            echo "Using configured production upload keystore."
            printf '%s' "$ZEROLOG_UPLOAD_KEYSTORE_B64" | base64 --decode > android/upload-keystore.jks
            test -s android/upload-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=../upload-keystore.jks
          storePassword=$ZEROLOG_UPLOAD_STORE_PASSWORD
          keyAlias=$ZEROLOG_UPLOAD_KEY_ALIAS
          keyPassword=$ZEROLOG_UPLOAD_KEY_PASSWORD
          EOF
          else
            echo "::warning::Production signing secrets are not configured; generating an ephemeral CI signing key for release smoke builds."
            rm -f android/ci-smoke-keystore.jks
            keytool -genkeypair -v \
              -keystore android/ci-smoke-keystore.jks \
              -storepass zerolog-ci-store \
              -keypass zerolog-ci-store \
              -alias zerolog-ci \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=ZeroLog CI, O=ZeroLog"
            test -s android/ci-smoke-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=../ci-smoke-keystore.jks
          storePassword=zerolog-ci-store
          keyAlias=zerolog-ci
          keyPassword=zerolog-ci-store
          EOF
          fi
          test -s android/key.properties

      - name: Verify release target and signing
        run: |
          set -euo pipefail
          grep -q 'targetSdk = 36' android/app/build.gradle.kts
          test -s android/key.properties
          SIGNING_FILE="$(grep '^storeFile=' android/key.properties | cut -d= -f2-)"
          test -s "android/${SIGNING_FILE#../}"

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Build release APK smoke artifact
        run: flutter build apk --release

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: zerolog-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: zerolog-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  legal-web:
    name: Static Legal Web Pages
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static legal site
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/privacy/index.html
          test -f web/delete-account/index.html
          test -f web/terms/index.html
          grep -q 'https://zerolog.giize.com/delete-account/csrf' web/delete-account/index.html
          grep -q 'https://zerolog.giize.com/delete-account"' web/delete-account/index.html
          ! grep -Rqs "zerolog.giize.com:" web
          echo "STATIC LEGAL WEB OK"

      - name: Upload static legal site
        uses: actions/upload-artifact@v4
        with:
          name: zerolog-static-legal-web
          path: web
          if-no-files-found: error
