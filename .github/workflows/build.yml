name: Matrix Zero Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Dart analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

  apk:
    name: Android APK
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Prepare production upload keystore
        env:
          ZEROLOG_UPLOAD_KEYSTORE_B64: ${{ secrets.ZEROLOG_UPLOAD_KEYSTORE_B64 }}
          ZEROLOG_UPLOAD_STORE_PASSWORD: ${{ secrets.ZEROLOG_UPLOAD_STORE_PASSWORD }}
          ZEROLOG_UPLOAD_KEY_ALIAS: ${{ secrets.ZEROLOG_UPLOAD_KEY_ALIAS }}
          ZEROLOG_UPLOAD_KEY_PASSWORD: ${{ secrets.ZEROLOG_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ZEROLOG_UPLOAD_KEYSTORE_B64" || { echo "Missing GitHub secret ZEROLOG_UPLOAD_KEYSTORE_B64"; exit 1; }
          test -n "$ZEROLOG_UPLOAD_STORE_PASSWORD" || { echo "Missing GitHub secret ZEROLOG_UPLOAD_STORE_PASSWORD"; exit 1; }
          test -n "$ZEROLOG_UPLOAD_KEY_ALIAS" || { echo "Missing GitHub secret ZEROLOG_UPLOAD_KEY_ALIAS"; exit 1; }
          test -n "$ZEROLOG_UPLOAD_KEY_PASSWORD" || { echo "Missing GitHub secret ZEROLOG_UPLOAD_KEY_PASSWORD"; exit 1; }
          printf '%s' "$ZEROLOG_UPLOAD_KEYSTORE_B64" | base64 --decode > android/upload-keystore.jks
          test -s android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=../upload-keystore.jks
          storePassword=$ZEROLOG_UPLOAD_STORE_PASSWORD
          keyAlias=$ZEROLOG_UPLOAD_KEY_ALIAS
          keyPassword=$ZEROLOG_UPLOAD_KEY_PASSWORD
          EOF

      - name: Verify production target
        run: |
          grep -q 'targetSdk = 36' android/app/build.gradle.kts

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Build release APK smoke artifact
        run: flutter build apk --release

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: zerolog-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: zerolog-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  legal-web:
    name: Static Legal Web Pages
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static legal site
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/privacy/index.html
          test -f web/delete-account/index.html
          test -f web/terms/index.html
          ! grep -Rqs "wss://zerolog.giize.com:8443/ws" web
          echo "STATIC LEGAL WEB OK"

      - name: Upload static legal site
        uses: actions/upload-artifact@v4
        with:
          name: zerolog-static-legal-web
          path: web
          if-no-files-found: error
