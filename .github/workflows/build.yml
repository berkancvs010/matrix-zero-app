name: Matrix Zero Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Dart analyze
        run: flutter analyze


  android:
    name: Android APK
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi

      - name: Ensure Android Internet permission
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          echo "APK BUILD SUCCESS"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: matrix-zero-android-arm64
          path: build/app/outputs/flutter-apk/app-release.apk


  web:
    name: Web Chat
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Create Web project
        run: |
          if [ ! -d "web" ]; then
            flutter create . --platforms=web
          fi

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --target lib/main_web.dart

      - name: Verify Web
        run: |
          test -f build/web/index.html
          echo "WEB BUILD SUCCESS"
          du -sh build/web

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: matrix-zero-web-chat
          path: build/web
