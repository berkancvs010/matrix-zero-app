name: Build Matrix Zero (APK + Web)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Configure Android Platform
        run: flutter create . --project-name matrix_zero --platforms android

      - name: Add Permissions to AndroidManifest
        run: |
          sed -i '/<manifest /a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml

      - name: Fix minSdkVersion
        run: |
          sed -i '/defaultConfig {/a \            minSdkVersion 21' android/app/build.gradle

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: matrix-zero-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Configure Web Platform
        run: flutter create . --project-name matrix_zero --platforms web

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web (no WebRTC)
        run: flutter build web --release --target lib/main_web.dart

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: matrix-zero-web-build
          path: build/web/
